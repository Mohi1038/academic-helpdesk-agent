[project]
name = "academic-helpdesk-agent"
version = "0.1.0"
description = "Multi-agent academic helpdesk for IIT Jodhpur (Google ADK + Ollama + ChromaDB RAG)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "truststore>=0.10.5",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.2.4",
    "google-adk>=2.13.0",
    "litellm>=1.106.4",
    "mcp>=2.3.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = ["pytest>=8"]
